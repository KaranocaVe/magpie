name: Custom build
run-name: Custom build — ${{ github.ref_name }} @ ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: amd64
          - runner: macos-latest
            platform: macos
            arch: arm64
          - runner: windows-latest
            platform: windows
            arch: multi
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify native architecture
        if: matrix.platform != 'windows'
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = "$TARGET_ARCH"

      - name: Install GTK and WebKitGTK
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build Linux desktop app
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          version="custom-${GITHUB_SHA:0:7}"
          binary="magpie-linux-$(go env GOARCH)"
          make release-linux VERSION="${version}"
          go version -m "dist/${binary}"
          tar -czf "dist/${binary}.tar.gz" -C dist "${binary}"
          rm "dist/${binary}"

      - name: Build macOS app bundle
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          version="custom-${GITHUB_SHA:0:7}"
          make app VERSION="${version}"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent magpie.app "dist/magpie-macos-$(uname -m).zip"

      - name: Build Windows desktop apps
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          version="custom-${GITHUB_SHA:0:7}"
          make release-windows VERSION="${version}"

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: magpie-custom-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  cli:
    name: CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: android
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build standalone CLI
        shell: bash
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          make release-cli TARGETS="${TARGET_GOOS}/${TARGET_GOARCH}" VERSION="custom-${GITHUB_SHA:0:7}"
          cd dist
          sha256sum * > SHA256SUMS
          suffix=""
          if [[ "$TARGET_GOOS" == windows ]]; then suffix=".exe"; fi
          test -s "magpie-cli-${TARGET_GOOS}-${TARGET_GOARCH}${suffix}"
      - uses: actions/upload-artifact@v4
        with:
          name: magpie-custom-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
