name: Sealed task compatibility

on:
  push:
    branches: ['fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sealed-task-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Run sealed-task routing regressions
        run: go test -tags gtk3 -count=1 -timeout 5m ./internal/gateway -run '^TestSealedTask'
